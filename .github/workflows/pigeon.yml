name: Nosy Pigeon

on:
  schedule:
    # Every 10 minutes, day and night (UTC; offset from :00 because GitHub delays top-of-hour runs).
    # Public repo, so Actions minutes are free.
    - cron: "4-54/10 * * * *"
  workflow_dispatch:
    inputs:
      roll_call:
        description: Send the list of watched places to Telegram instead of checking
        type: boolean
        default: false
      test_coo:
        description: Send one practice coo with buttons instead of checking
        type: boolean
        default: false
      health_check:
        description: Check every site now and send a health report to Telegram (sends no job alerts)
        type: boolean
        default: false
      knock:
        description: Diagnose one window by name (status codes go to the loft)
        type: string
        default: ""

permissions:
  contents: write      # needed to commit seen.json and health.json back

concurrency:
  group: pigeon
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main   # always the latest code and memory, even on re-runs

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Check sites and send pings
        env:
          PIGEON_CONFIG: ${{ secrets.PIGEON_CONFIG }}
          PIGEON_DB_URL: ${{ secrets.PIGEON_DB_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          WHATSAPP_PHONE: ${{ secrets.WHATSAPP_PHONE }}
          WHATSAPP_APIKEY: ${{ secrets.WHATSAPP_APIKEY }}
        run: python pigeon.py ${{ inputs.roll_call && '--roll-call' || '' }} ${{ inputs.test_coo && '--test-coo' || '' }} ${{ inputs.knock && format('--knock {0}', inputs.knock) || '' }} ${{ inputs.health_check && '--health-check' || '' }}

      - name: Save what the pigeon saw
        if: ${{ !cancelled() }}   # keep its health notes even when every window failed
        run: |
          git config user.name "nosy-pigeon"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add seen.json health.json
          git diff --cached --quiet && exit 0
          git commit -m "chore: pigeon memory [skip ci]"
          # main may have moved while we flew: rebase and retry
          for i in 1 2 3; do
            git pull --rebase -q origin main && git push -q origin main && exit 0
            sleep 5
          done
          exit 1
